<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Môj webový obchod</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 1000px;
    margin: 40px auto;
    padding: 20px;
    background: #f4f6f9;
    color: #333;
}

.kontajner {
    display: flex;
    gap: 20px;
    align-items: stretch;
}

.admin-button {
    background: #8b5cf6;
    color: white;
    padding: 10px 16px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
}
    
.karta {
    background: white;
    padding: 20px;
    border-radius: 9px;
    flex: 1;
    min-width: 0;
    box-shadow: 0 2px 5px #0001;
}

.polozka {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid #eee;
    padding: 12px 0;
}

button {
    background: #4f46e5;
    color: white;
    border: none;
    padding: 9px 12px;
    border-radius: 5px;
    cursor: pointer;
}

button:disabled {
    background: #aaa;
    cursor: not-allowed;
}

.tlacidla-zlav {
    display: flex;
    gap: 10px;
    margin: 15px 0;
}

.tlacidla-zlav button {
    flex: 1;
}

.kupon {
    background: #db2777;
}

.btn-platba {
    background: #22c55e;
    width: 100%;
    padding: 13px;
    font-weight: bold;
    margin-top: 15px;
}

select {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
}

@media (max-width: 650px) {
    .kontajner {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<a href="/admin.html" class="admin-button"
   style="position:absolute;top:15px;right:20px;">
    Admin panel
</a>

<h1>=== OBCHOD ===</h1>

<div class="kontajner">

    <div class="karta">
        <h2>Ponuka produktov</h2>
        <div id="produkty-box"></div>
    </div>

    <div class="karta">
        <h2>--- KOŠÍK ---</h2>
        <ul id="kosik-box">
            <li>Košík je prázdny</li>
        </ul>

        <hr>

        <h3>Celková cena: <span id="cena-box">0.00</span> €</h3>

        <div class="tlacidla-zlav">
            <button id="clubcard" onclick="uplatnitClubcard()">
                💳 Skenovať Clubcard (-10%)
            </button>

            <button id="kupon" class="kupon" onclick="uplatnitKupon()">
                🎟️ Použiť kupón (-20%)
            </button>
        </div>

        <label for="platba">Zvoľte spôsob platby:</label>

        <select id="platba">
            <option value="Hotovosť">1. Hotovosť</option>
            <option value="Karta">2. Karta</option>
            <option value="Kupón">3. Kupón</option>
        </select>

        <button class="btn-platba" onclick="zaplatit()">
            Zaplatiť nákup
        </button>
    </div>

</div>

<!-- PREPOJENIE NA SUPABASE KNIŽNICE -->
<script src="https://jsdelivr.net"></script>
<script src="supabase.js"></script>

<script>
let produkty = [];
let kosik = [];
let clubcard = false;
let kupon = false;

// Zobrazovanie upravené na anglické názvy stĺpcov z databázy (name, category, price, stock)
function zobrazProdukty() {
    let html = "";

    if (produkty.length === 0) {
        html = "<p>Načítavam produkty z databázy...</p>";
    }

    produkty.forEach(function(p) {
        html += `
            <div class="polozka">
                <div>
                    <strong>${p.name}</strong><br>
                    ${p.category || 'Bez kategórie'}<br>
                    ${Number(p.price).toFixed(2)} €<br>
                    Sklad: ${p.stock}
                </div>

                <button
                    onclick="kupit(${p.id})"
                    ${p.stock === 0 ? "disabled" : ""}>
                    ${p.stock === 0 ? "Vypredané" : "Kúpiť"}
                </button>
            </div>
        `;
    });

    document.getElementById("produkty-box").innerHTML = html;
}

function kupit(id) {
    let produkt = produkty.find(p => p.id === id);

    if (produkt && produkt.stock > 0) {
        kosik.push(produkt);
        produkt.stock--;

        zobrazProdukty();
        zobrazKosik();
    }
}

function zobrazKosik() {
    let html = "";
    let cena = 0;

    if (kosik.length === 0) {
        html = "<li>Košík je prázdny</li>";
    } else {
        kosik.forEach(function(p, index) {
            html += `<li>${p.name} - ${Number(p.price).toFixed(2)} €
            <button onclick="odstranit(${index})">X</button></li>`;

            cena += Number(p.price);
        });
    }

    if (clubcard) {
        cena = cena * 0.9;
    }

    if (kupon) {
        cena = cena * 0.8;
    }

    document.getElementById("kosik-box").innerHTML = html;
    document.getElementById("cena-box").innerText = cena.toFixed(2);

    document.getElementById("clubcard").disabled = clubcard;
    document.getElementById("kupon").disabled = kupon;
}

function odstranit(index) {
    let produkt = kosik[index];

    produkt.stock++;
    kosik.splice(index, 1);

    zobrazProdukty();
    zobrazKosik();
}

function uplatnitClubcard() {
    if (!clubcard) {
        clubcard = true;
        zobrazKosik();
        alert("Clubcard použitá! Zľava 10 %.");
    }
}

function uplatnitKupon() {
    if (!kupon) {
        kupon = true;
        zobrazKosik();
        alert("Kupón použitý! Zľava 20 %.");
    }
}

// Načítanie dát zo Supabase (používa správny stĺpec 'stock')
async function nacitajSklad() {
    try {
        const { data, error } = await supabase
            .from("products")
            .select("*");

        if (error) throw error;
        
        produkty = data;
    } catch (e) {
        console.error("Sklad sa nepodarilo načítať zo Supabase", e);
    }
    zobrazProdukty();
    zobrazKosik();
}

// Odpočítavanie stavu zásob po zaplatení v anglickom stĺpci 'stock'
async function zaplatit() {
    if (kosik.length === 0) {
        alert("Najprv pridaj produkt do košíka!");
        return;
    }

    try {
        for (const produkt of kosik) {
            const { data: aktualnyProdukt, error: fetchError } = await supabase
                .from("products")
                .select("stock")
                .eq("id", produkt.id)
                .single();

            if (fetchError) throw fetchError;

            if (aktualnyProdukt.stock <= 0) {
                alert(`Produkt ${produkt.name} sa medzičasom vypredal!`);
                kosik = [];
                await nacitajSklad();
                return;
            }

            const { error: updateError } = await supabase
                .from("products")
                .update({ stock: aktualnyProdukt.stock - 1 })
                .eq("id", produkt.id);

            if (updateError) throw updateError;
        }

        const cena = Number(document.getElementById("cena-box").innerText);
        const sposob = document.getElementById("platba").value;
        alert("Ďakujeme za nákup!\nCelková cena: " + cena.toFixed(2) + " €\nPlatba: " + sposob);

    } catch (error) {
        alert("Nákup zlyhal. Skontroluj internetové pripojenie alebo RLS nastavenia v Supabase.");
        console.error(error);
    }

    kosik = [];
    clubcard = false;
    kupon = false;
    await nacitajSklad();
}

document.addEventListener('DOMContentLoaded', nacitajSklad);
</script>

</body>
</html>
