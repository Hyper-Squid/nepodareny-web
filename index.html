<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Môj webový obchod</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 1000px;
    margin: 40px auto;
    padding: 20px;
    background: #f4f6f9;
    color: #333;
}

.kontajner {
    display: flex;
    gap: 20px;
    align-items: stretch;
}

.admin-button {
    background: #8b5cf6;
    color: white;
    padding: 10px 16px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
}
    
.karta {
    background: white;
    padding: 20px;
    border-radius: 9px;
    flex: 1;
    min-width: 0;
    box-shadow: 0 2px 5px #0001;
}

.polozka {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid #eee;
    padding: 12px 0;
}

button {
    background: #4f46e5;
    color: white;
    border: none;
    padding: 9px 12px;
    border-radius: 5px;
    cursor: pointer;
}

button:disabled {
    background: #aaa;
    cursor: not-allowed;
}

.tlacidla-zlav {
    display: flex;
    gap: 10px;
    margin: 15px 0;
}

.tlacidla-zlav button {
    flex: 1;
}

.kupon {
    background: #db2777;
}

.btn-platba {
    background: #22c55e;
    width: 100%;
    padding: 13px;
    font-weight: bold;
    margin-top: 15px;
}

select {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
}

@media (max-width: 650px) {
    .kontajner {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<a href="/admin.html" class="admin-button"
   style="position:absolute;top:15px;right:20px;">
    Admin panel
</a>

<h1>=== OBCHOD ===</h1>

<div class="kontajner">

    <div class="karta">
        <h2>Ponuka produktov</h2>
        <div id="produkty-box"></div>
    </div>

    <div class="karta">
        <h2>--- KOŠÍK ---</h2>
        <ul id="kosik-box">
            <li>Košík je prázdny</li>
        </ul>

        <hr>

        <h3>Celková cena: <span id="cena-box">0.00</span> €</h3>

        <div class="tlacidla-zlav">
            <button id="clubcard" onclick="uplatnitClubcard()">
                💳 Skenovať Clubcard (-10%)
            </button>

            <button id="kupon" class="kupon" onclick="uplatnitKupon()">
                🎟️ Použiť kupón (-20%)
            </button>
        </div>

        <label for="platba">Zvoľte spôsob platby:</label>

        <select id="platba">
            <option value="Hotovosť">1. Hotovosť</option>
            <option value="Karta">2. Karta</option>
            <option value="Kupón">3. Kupón</option>
        </select>

        <button class="btn-platba" onclick="zaplatit()">
            Zaplatiť nákup
        </button>
    </div>

</div>

<script>
let produkty = [];
    { id: 0, nazov: "Jablko", cena: 0.50, druh: "Ovocie", sklad: 5 },
    { id: 1, nazov: "Banán", cena: 0.45, druh: "Ovocie", sklad: 3 },
    { id: 2, nazov: "Mrkva", cena: 0.30, druh: "Zelenina", sklad: 4 },
    { id: 3, nazov: "Zemiak", cena: 0.25, druh: "Zelenina", sklad: 6 },
    { id: 4, nazov: "Mlieko", cena: 1.20, druh: "Mliečne", sklad: 2 }
];

let kosik = [];
let clubcard = false;
let kupon = false;

function zobrazProdukty() {
    let html = "";

    produkty.forEach(function(p) {
        html += `
            <div class="polozka">
                <div>
                    <strong>${p.nazov}</strong><br>
                    ${p.druh}<br>
                    ${p.cena.toFixed(2)} €<br>
                    Sklad: ${p.sklad}
                </div>

                <button
                    onclick="kupit(${p.id})"
                    ${p.sklad === 0 ? "disabled" : ""}>
                    ${p.sklad === 0 ? "Vypredané" : "Kúpiť"}
                </button>
            </div>
        `;
    });

    document.getElementById("produkty-box").innerHTML = html;
}

function kupit(id) {
    let produkt = produkty[id];

    if (produkt && produkt.sklad > 0) {
        kosik.push(produkt);
        produkt.sklad--;

        zobrazProdukty();
        zobrazKosik();
    }
}

function zobrazKosik() {
    let html = "";
    let cena = 0;

    if (kosik.length === 0) {
        html = "<li>Košík je prázdny</li>";
    } else {
        kosik.forEach(function(p, index) {
            html += `<li>${p.nazov} - ${p.cena.toFixed(2)} €
            <button onclick="odstranit(${index})">X</button></li>`;

            cena += p.cena;
        });
    }

    if (clubcard) {
        cena = cena * 0.9;
    }

    if (kupon) {
        cena = cena * 0.8;
    }

    document.getElementById("kosik-box").innerHTML = html;
    document.getElementById("cena-box").innerText = cena.toFixed(2);

    document.getElementById("clubcard").disabled = clubcard;
    document.getElementById("kupon").disabled = kupon;
}

function odstranit(index) {
    let produkt = kosik[index];

    produkt.sklad++;
    kosik.splice(index, 1);

    zobrazProdukty();
    zobrazKosik();
}

function uplatnitClubcard() {
    if (!clubcard) {
        clubcard = true;
        zobrazKosik();
        alert("Clubcard použitá! Zľava 10 %.");
    }
}

function uplatnitKupon() {
    if (!kupon) {
        kupon = true;
        zobrazKosik();
        alert("Kupón použitý! Zľava 20 %.");
    }
}

// Načíta aktuálny sklad zo servera (Netlify Function + Blobs)
async function nacitajSklad() {
    try {
        const res = await fetch("/api/stock");
        const sklad = await res.json();
        produkty.forEach(p => p.sklad = sklad[p.id]);
    } catch (e) {
        console.warn("Sklad sa nepodarilo načítať", e);
    }
    zobrazProdukty();
    zobrazKosik();
}

async function zaplatit() {
    if (kosik.length === 0) {
        alert("Najprv pridaj produkt do košíka!");
        return;
    }

    const items = {};
    kosik.forEach(p => items[p.id] = (items[p.id] || 0) + 1);

    const res = await fetch("/api/stock", {
        method: "POST",
        body: JSON.stringify({ items })
    });

    if (!res.ok) {
        alert("Niekto bol rýchlejší, niečo už nie je na sklade. Obnovujem ponuku.");
        kosik = [];
        await nacitajSklad();
        return;
    }

    const cena = Number(document.getElementById("cena-box").innerText);
    const sposob = document.getElementById("platba").value;
    alert("Ďakujeme za nákup!\nCelková cena: " + cena.toFixed(2) + " €\nPlatba: " + sposob);

    kosik = [];
    clubcard = false;
    kupon = false;
    await nacitajSklad();
}

nacitajSklad();
</script>

</body>
</html>
