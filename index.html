
<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin panel</title>
<style>
body{font-family:Arial,sans-serif;max-width:1000px;margin:30px auto;padding:15px;background:#f4f6f9;color:#222}
.card{background:white;padding:20px;border-radius:12px;margin-bottom:20px}
input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #ccc;border-radius:6px}
button{padding:10px 14px;border:0;border-radius:6px;background:#4f46e5;color:white;cursor:pointer;margin:4px}
.red{background:#dc2626}
.green{background:#16a34a}
table{width:100%;border-collapse:collapse;margin:15px 0}
td,th{text-align:left;padding:7px;border-bottom:1px solid #ddd}
.hidden{display:none}
#status{white-space:pre-wrap}
</style>
</head>
<body>
<h1>🔧 Admin panel</h1>

<div id="login" class="card">
<h2>Prihlásenie</h2>
<input id="password" type="password" placeholder="Admin heslo">
<button id="loginBtn">Prihlásiť sa</button>
<p id="loginError"></p>
</div>

<div id="panel" class="card hidden">
<h2>Správa produktov</h2>
<a href="/">Späť do obchodu</a>
<button id="logout" class="red">Odhlásiť</button>

<table>
<thead><tr><th>Názov</th><th>Druh</th><th>Cena (€)</th><th>Sklad</th><th></th></tr></thead>
<tbody id="rows"></tbody>
</table>

<button id="add">+ Pridať produkt</button>
<button id="save" class="green">Uložiť zmeny</button>
<p id="status"></p>
</div>

<script>
const $ = id => document.getElementById(id);
let password = "";
let products = [];
let busy = false;

async function request(method = "GET", body) {
    const headers = {};
    if (password) headers.Authorization = "Bearer " + password;
    if (body !== undefined) headers["Content-Type"] = "application/json";

    const response = await fetch("/api/products", {
        method,
        headers,
        body: body === undefined ? undefined : JSON.stringify(body),
        cache: "no-store"
    });

    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || "HTTP " + response.status);
    return data;
}

async function login() {
    if (busy) return;
    password = $("password").value.trim();
    if (!password) {
        $("loginError").textContent = "Zadaj heslo.";
        return;
    }

    busy = true;
    $("loginBtn").disabled = true;
    $("loginError").textContent = "Prihlasujem...";

    try {
        await request("POST");
        products = await request("GET");

        if (!Array.isArray(products)) throw new Error("Neplatná odpoveď servera.");

        $("login").classList.add("hidden");
        $("panel").classList.remove("hidden");
        $("loginError").textContent = "";
        render();
    } catch (e) {
        password = "";
        $("loginError").textContent = "Prihlásenie alebo načítanie zlyhalo: " + e.message;
    } finally {
        busy = false;
        $("loginBtn").disabled = false;
    }
}

function render() {
    $("rows").replaceChildren();

    products.forEach((p, index) => {
        const tr = document.createElement("tr");

        for (const key of ["nazov", "druh", "cena", "sklad"]) {
            const td = document.createElement("td");
            const input = document.createElement("input");

            input.value = p[key] ?? "";
            input.type = (key === "cena" || key === "sklad") ? "number" : "text";

            if (key === "cena") {
                input.min = "0";
                input.step = "0.01";
            }

            if (key === "sklad") {
                input.min = "0";
                input.step = "1";
            }

            input.addEventListener("input", () => {
                products[index][key] = input.value;
            });

            td.appendChild(input);
            tr.appendChild(td);
        }

        const td = document.createElement("td");
        const del = document.createElement("button");
        del.textContent = "Odstrániť";
        del.className = "red";

        del.onclick = () => {
            products.splice(index, 1);
            render();
            status("Produkt odstránený z návrhu. Klikni na Uložiť zmeny.", true);
        };

        td.appendChild(del);
        tr.appendChild(td);
        $("rows").appendChild(tr);
    });
}

function addProduct() {
    products.push({nazov:"", druh:"", cena:"0.00", sklad:"0"});
    render();
    status("Nový produkt pridaný. Vyplň údaje a klikni na Uložiť zmeny.", true);
    $("rows").lastElementChild?.querySelector("input")?.focus();
}

function status(message, ok = false) {
    $("status").textContent = message;
    $("status").style.color = ok ? "green" : "#dc2626";
}

async function save() {
    if (busy) return;

    for (const p of products) {
        p.nazov = String(p.nazov ?? "").trim();
        p.druh = String(p.druh ?? "").trim();
        p.cena = Number(p.cena);
        p.sklad = Number(p.sklad);

        if (!p.nazov || !p.druh ||
            !Number.isFinite(p.cena) || p.cena < 0 ||
            !Number.isInteger(p.sklad) || p.sklad < 0) {
            status("Skontroluj názov, druh, cenu a sklad pri každom produkte.");
            return;
        }
    }

    busy = true;
    $("save").disabled = true;
    $("add").disabled = true;
    status("Ukladám...");

    try {
        products = await request("PUT", products);
        render();
        status("Produkty boli uložené do databázy!", true);
    } catch (e) {
        status("Uloženie zlyhalo: " + e.message);
    } finally {
        busy = false;
        $("save").disabled = false;
        $("add").disabled = false;
    }
}

$("loginBtn").addEventListener("click", login);
$("password").addEventListener("keydown", e => {
    if (e.key === "Enter") login();
});
$("add").addEventListener("click", addProduct);
$("save").addEventListener("click", save);

$("logout").addEventListener("click", () => {
    password = "";
    products = [];
    $("password").value = "";
    $("panel").classList.add("hidden");
    $("login").classList.remove("hidden");
    $("rows").replaceChildren();
    $("status").textContent = "";
});
</script>
</body>
</html>
