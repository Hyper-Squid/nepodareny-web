
<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Hyper Store – Admin</title>

<style>
*{box-sizing:border-box}
body{margin:0;padding:25px;background:#0b0b10;color:#f5f5f5;font-family:Arial,sans-serif}
main{max-width:1000px;margin:auto}
.card{background:#17171f;border:1px solid #30303b;border-radius:14px;padding:24px;margin-bottom:20px}
h1{color:#a78bfa}
input{width:100%;min-width:0;padding:11px;margin:5px 0;background:#101016;color:white;border:1px solid #414150;border-radius:7px}
button{padding:10px 14px;border:0;border-radius:7px;background:#8b5cf6;color:white;cursor:pointer;font-weight:bold}
button:disabled{opacity:.5;cursor:not-allowed}
.red{background:#dc2626}
.green{background:#16a34a}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hidden{display:none!important}
table{width:100%;border-collapse:collapse;margin:20px 0}
th,td{text-align:left;padding:8px;border-bottom:1px solid #333;vertical-align:middle}
#status{white-space:pre-wrap;margin-top:15px}
a{color:#c4b5fd}
@media(max-width:650px){
 body{padding:10px}
 .card{padding:14px;overflow-x:auto}
 table{min-width:650px}
}
</style>
</head>
<body>
<main>
<h1>HYPER STORE — Admin</h1>

<section id="login" class="card">
<h2>Prihlásenie</h2>
<form id="loginForm">
<input id="password" type="password" placeholder="Admin heslo" required autocomplete="current-password">
<button id="loginButton" type="submit">Prihlásiť sa</button>
</form>
<p id="loginError"></p>
</section>

<section id="panel" class="card hidden">
<div class="row">
<h2>Správa produktov</h2>
<div>
<a href="/">Späť do obchodu</a>
<button class="red" id="logoutButton">Odhlásiť</button>
</div>
</div>

<p>Pridávaj produkty, upravuj ceny a skladové zásoby.</p>

<div style="overflow-x:auto">
<table>
<thead>
<tr>
<th>Názov</th>
<th>Druh</th>
<th>Cena (€)</th>
<th>Sklad</th>
<th>Akcia</th>
</tr>
</thead>
<tbody id="products"></tbody>
</table>
</div>

<div class="row">
<button id="addButton">+ Pridať produkt</button>
<button class="green" id="saveButton">Uložiť zmeny</button>
</div>
<p id="status"></p>
</section>
</main>

<script>
const $ = id => document.getElementById(id);

let password = "";
let products = [];
let busy = false;

async function api(url, options = {}) {
 const headers = new Headers(options.headers || {});
 if (password) headers.set("Authorization", "Bearer " + password);
 if (options.body) headers.set("Content-Type", "application/json");

 const response = await fetch(url, {
  ...options,
  headers,
  cache: "no-store"
 });

 const data = await response.json().catch(() => ({}));

 if (!response.ok) {
  throw new Error(data.error || "Chyba servera: " + response.status);
 }

 return data;
}

function setStatus(message, success = false) {
 $("status").textContent = message;
 $("status").style.color = success ? "#4ade80" : "#f87171";
}

async function login(event) {
 event.preventDefault();
 if (busy) return;

 busy = true;
 $("loginButton").disabled = true;
 $("loginError").textContent = "Prihlasujem...";

 password = $("password").value;

 try {
  await api("/api/products", {method:"POST"});
  products = await api("/api/products");

  if (!Array.isArray(products)) {
   throw new Error("Server neposlal zoznam produktov.");
  }

  $("login").classList.add("hidden");
  $("panel").classList.remove("hidden");
  $("loginError").textContent = "";
  render();
 } catch (error) {
  password = "";
  $("loginError").textContent = error.message;
 } finally {
  busy = false;
  $("loginButton").disabled = false;
 }
}

function logout() {
 password = "HyperSquid46220";
 products = [];
 $("password").value = "HyperSquid46220";
 $("panel").classList.add("hidden");
 $("login").classList.remove("hidden");
 $("products").replaceChildren();
 $("status").textContent = "";
}

function makeInput(value, type, key, min, step) {
 const input = document.createElement("input");
 input.value = value ?? "";
 input.type = type;
 input.dataset.key = key;

 if (type === "number") {
  input.min = min;
  input.step = step;
  input.required = true;
 }

 input.addEventListener("input", () => {
  const row = input.closest("tr");
  const index = Number(row.dataset.index);

  if (type === "number") {
   products[index][key] = input.value;
  } else {
   products[index][key] = input.value;
  }
 });

 return input;
}

function render() {
 const body = $("products");
 body.replaceChildren();

 products.forEach((product, index) => {
  const row = document.createElement("tr");
  row.dataset.index = index;

  const fields = [
   ["nazov", "text"],
   ["druh", "text"],
   ["cena", "number"],
   ["sklad", "number"]
  ];

  fields.forEach(([key, type]) => {
   const cell = document.createElement("td");
   cell.appendChild(makeInput(
    product[key],
    type,
    key,
    0,
    key === "cena" ? "0.01" : "1"
   ));
   row.appendChild(cell);
  });

  const actionCell = document.createElement("td");
  const remove = document.createElement("button");
  remove.className = "red";
  remove.textContent = "Odstrániť";

  remove.onclick = () => {
   if (confirm("Naozaj odstrániť tento produkt?")) {
    products.splice(index, 1);
    render();
   }
  };

  actionCell.appendChild(remove);
  row.appendChild(actionCell);
  body.appendChild(row);
 });
}

function addProduct() {
 products.push({
  nazov:"",
  druh:"",
  cena:"0.00",
  sklad:"0"
 });

 render();
}

async function saveProducts() {
 if (busy) return;

 for (const product of products) {
  if (!String(product.nazov).trim()) {
   setStatus("Každý produkt musí mať názov.");
   return;
  }

  if (!String(product.druh).trim()) {
   setStatus("Každý produkt musí mať druh.");
   return;
  }

  const price = Number(product.cena);
  const stock = Number(product.sklad);

  if (!Number.isFinite(price) || price < 0 ||
      !Number.isInteger(stock) || stock < 0) {
   setStatus("Cena alebo sklad majú neplatnú hodnotu.");
   return;
  }

  product.cena = price;
  product.sklad = stock;
  product.nazov = String(product.nazov).trim();
  product.druh = String(product.druh).trim();
 }

 busy = true;
 $("saveButton").disabled = true;
 $("addButton").disabled = true;
 setStatus("Ukladám produkty...", true);

 try {
  products = await api("/api/products", {
   method:"PUT",
   body:JSON.stringify(products)
  });

  render();
  setStatus("Produkty boli úspešne uložené!", true);
 } catch (error) {
  setStatus("Nepodarilo sa uložiť: " + error.message);
 } finally {
  busy = false;
  $("saveButton").disabled = false;
  $("addButton").disabled = false;
 }
}

$("loginForm").addEventListener("submit", login);
$("logoutButton").addEventListener("click", logout);
$("addButton").addEventListener("click", addProduct);
$("saveButton").addEventListener("click", saveProducts);
</script>
</body>
</html>
