<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin panel</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; background: #f4f6f9; color: #333; }
  .karta { background: #fff; padding: 20px; border-radius: 9px; box-shadow: 0 2px 5px #0001; }
  button { background: #4f46e5; color: #fff; border: none; padding: 9px 14px; border-radius: 5px; cursor: pointer; }
  button.red { background: #dc2626; }
  button.green { background: #22c55e; font-weight: bold; }
  input { padding: 8px; border: 1px solid #ccc; border-radius: 5px; width: 100%; box-sizing: border-box; }
  table { width: 100%; border-collapse: collapse; margin: 15px 0; }
  th, td { text-align: left; padding: 6px; border-bottom: 1px solid #eee; }
  .row { display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
  #stav { margin-top: 10px; font-weight: bold; }
  .hidden { display: none; }
</style>
</head>
<body>
<h1>🔧 Admin panel</h1>

<div id="login" class="karta">
  <h2>Prihlásenie</h2>
  <input type="password" id="heslo" placeholder="Admin heslo" onkeydown="if(event.key==='Enter')prihlasit()">
  <p><button onclick="prihlasit()">Prihlásiť sa</button></p>
  <div id="login-chyba" style="color:#dc2626"></div>
</div>

<div id="panel" class="karta hidden">
  <div class="row">
    <h2>Produkty</h2>
    <div>
      <a href="/">← Späť do obchodu</a>
      <button class="red" onclick="odhlasit()">Odhlásiť</button>
    </div>
  </div>
  <table>
    <thead><tr><th>Názov</th><th>Druh</th><th>Cena (€)</th><th>Sklad</th><th></th></tr></thead>
    <tbody id="telo"></tbody>
  </table>
  <div class="row">
    <button onclick="pridat()">➕ Pridať produkt</button>
    <button class="green" onclick="ulozit()">💾 Uložiť zmeny</button>
  </div>
  <div id="stav"></div>
</div>

<script>
let heslo = sessionStorage.getItem("admin-heslo") || "";
let produkty = [];

const $ = (id) => document.getElementById(id);

async function prihlasit() {
  heslo = $("heslo").value || heslo;
  const r = await fetch("/api/products", {
    method: "POST",
    headers: { Authorization: "Bearer " + heslo },
  });
  if (!r.ok) {
    $("login-chyba").textContent = "Nesprávne heslo alebo ADMIN_PASSWORD nie je nastavené.";
    return;
  }
  sessionStorage.setItem("admin-heslo", heslo);
  $("login").classList.add("hidden");
  $("panel").classList.remove("hidden");
  const data = await (await fetch("/api/products")).json();
  produkty = data;
  vykresli();
}

function odhlasit() {
  sessionStorage.removeItem("admin-heslo");
  location.reload();
}

function vykresli() {
  $("telo").innerHTML = "";
  produkty.forEach((p, i) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><input value="" data-k="nazov"></td>
      <td><input value="" data-k="druh"></td>
      <td><input type="number" step="0.01" min="0" data-k="cena"></td>
      <td><input type="number" step="1" min="0" data-k="sklad"></td>
      <td><button class="red">🗑</button></td>`;
    tr.querySelectorAll("input").forEach((inp) => {
      inp.value = p[inp.dataset.k];
      inp.oninput = () => { p[inp.dataset.k] = inp.value; };
    });
    tr.querySelector("button").onclick = () => {
      if (confirm("Zmazať " + (p.nazov || "produkt") + "?")) {
        produkty.splice(i, 1);
        vykresli();
      }
    };
    $("telo").appendChild(tr);
  });
}

function pridat() {
  produkty.push({ nazov: "", druh: "", cena: 0, sklad: 0 });
  vykresli();
}

async function ulozit() {
  $("stav").style.color = "#333";
  $("stav").textContent = "Ukladám...";
  const r = await fetch("/api/products", {
    method: "PUT",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + heslo },
    body: JSON.stringify(produkty),
  });
  if (r.ok) {
    produkty = await r.json();
    vykresli();
    $("stav").style.color = "#16a34a";
    $("stav").textContent = "✅ Uložené!";
  } else {
    const e = await r.json().catch(() => ({}));
    $("stav").style.color = "#dc2626";
    $("stav").textContent = "❌ " + (e.error || "Chyba pri ukladaní");
  }
}

if (heslo) { $("heslo").value = heslo; prihlasit(); }
</script>
</body>
</html>
